<!DOCTYPE html>
<html>
    <head>
        <title>Admin Dashboard</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
            <style>
                h1{
                    align-items: center;
                    align-content: center;
                    align-self: center;
                }
                a{
                    display: inline;
                    align-items: center;
                    background-color:#2980b9 ;
                }
                .button {
                display: inline-block;
                padding: 12px 25px;
                margin: 10px;
                font-size: 16px;
                color: #fff;
                background-color: #2980b9;
                border: none;
                border-radius: 5px;
                text-decoration: none;
            }
            .button:hover {
                background-color: #1f6391;
            }
        </style>
    </head>
    <body>
        {% extends 'base.html' %}

        {% block title %}User Registration{% endblock %}

        {% block content %}
        <h1>Admin Dashboard</h1>
        <a href="{{url_for('add_candidate')}}" class="button">Add candidate</a>
        <a href="{{url_for('result')}}" class="button">Result</a>
        <a href="{{url_for('block_data')}}" class="button">Block data</a>
        <a href="{{url_for('show_benchmark')}}" class="button">Time</a>
        {% endblock %}
    </body>
</html>
