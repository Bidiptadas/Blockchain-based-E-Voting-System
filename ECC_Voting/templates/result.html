<!DOCTYPE html>
<html>
    <head>
        <title>Results</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <style>
            .button {
            display: inline-block;
            padding: 12px 25px;
            margin: 10px;
            font-size: 16px;
            color: #fff;
            background-color: #2980b9;
            border: none;
            border-radius: 5px;
            text-decoration: none;
        }
        .button:hover {
            background-color: #1f6391;
        }
        </style>
    </head>
    <body>
        {% extends 'base.html' %}

        {% block title %}User Registration{% endblock %}

        {% block content %}
        <h2>Voting Results</h2>
        <table>
            <thead>
                <tr>
                    <td>Candidate name</td>
                    <td>Party</td>
                    <td>Vote count</td>
                </tr>
            </thead>
            <tbody>
                {% for c in r_data %}
                    <tr>
                        <td>{{c['name']}}</td>
                        <td>{{c['party']}}</td>
                        <td>{{c['vote_count']}}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="{{url_for('Welcome')}}" class="button">Home</a>
        {% endblock %}
    </body>
</html>
